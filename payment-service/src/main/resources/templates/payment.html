<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" type="text/css" href="/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포트원 결제</title>
    <script src="https://cdn.portone.io/v2/browser-sdk.js" async defer></script>
    <script th:inline="javascript">
        // 서버에서 전달한 데이터를 JavaScript 변수로 저장
        const ORDER_DATA = {
            orderId: /*[[${orderId}]]*/ '',
            amount: /*[[${amount}]]*/ 0,
            storeId: /*[[${storeId}]]*/ '',
            channelKey: /*[[${channelKey}]]*/ ''
        };
    </script>
</head>
<body>
<div id="root">
    <dialog id="loadingDialog" open>
        <article aria-busy="true">결제 정보를 불러오는 중입니다.</article>
    </dialog>
    <main id="checkoutDialog" style="display: none">
        <form id="checkoutForm">
            <article>
                <div class="item">
                    <div class="item-image">
                        <img id="itemImage" />
                    </div>
                    <div class="item-text">
                        <h5 id="itemName"></h5>
                        <p class="price-value"></p>
                    </div>
                </div>
                <div class="price">
                    <label>총 구입 가격</label>
                    <span class="price-value" />
                </div>
            </article>
            <button id="checkoutButton" type="submit">결제</button>
        </form>
    </main>
    <dialog id="failDialog">
        <header>
            <h1>결제 실패</h1>
        </header>
        <p id="failMessage"></p>
        <button type="button" class="closeDialog">닫기</button>
    </dialog>
    <dialog id="successDialog">
        <header>
            <h1>결제 성공</h1>
        </header>
        <p>결제에 성공했습니다.</p>
        <button type="button" class="closeDialog">닫기</button>
    </dialog>
    <dialog id="virtualAccountDialog">
        <header>
            <h1>가상계좌 발급 완료</h1>
        </header>
        <p>가상계좌가 발급되었습니다.</p>
        <button type="button" class="closeDialog">닫기</button>
    </dialog>
</div>
<script>
    let checkout = null

    // Thymeleaf에서 전달받은 설정으로 즉시 Checkout 초기화
    checkout = new Checkout(ORDER_DATA.storeId, ORDER_DATA.channelKey)
    checkout.load()

    function Checkout(storeId, channelKey) {
        this.load = async () => {
            const waitPortOne = new Promise((resolve) => {
                const polling = setInterval(() => {
                    if (window.PortOne != null) {
                        clearInterval(polling)
                        resolve()
                    }
                }, 50)
            })
            await waitPortOne
            window.loadingDialog.open = false
            window.checkoutDialog.open = true
            await this.showCheckout()
        }
        this.showCheckout = async () => {
            window.itemName.replaceChildren(ORDER_DATA.orderId)
            window.itemImage.src = `/favicon.png`
            for (const priceElement of document.querySelectorAll(
                ".price-value",
            )) {
                priceElement.replaceChildren(`${ORDER_DATA.amount.toLocaleString()}원`)
            }
            window.checkoutDialog.onsubmit = async (e) => {
                e.preventDefault()
                this.setWaitingPayment(true)

                // 1. 먼저 백엔드에서 Payment 생성
                const prepareResponse = await fetch("/api/v1/payments", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        orderId: ORDER_DATA.orderId,
                        totalAmount: ORDER_DATA.amount,
                    }),
                })

                if (!prepareResponse.ok) {
                    this.setWaitingPayment(false)
                    this.openFailDialog("결제 준비에 실패했습니다.")
                    return
                }

                const { paymentId, portOnePaymentId } = await prepareResponse.json()

                // 2. PortOne 결제 요청 (백엔드에서 받은 portOnePaymentId 사용)
                const payment = await PortOne.requestPayment({
                    storeId,
                    channelKey,
                    paymentId: portOnePaymentId,
                    orderName: ORDER_DATA.orderId,
                    totalAmount: ORDER_DATA.amount,
                    currency: 'KRW',
                    payMethod: "CARD",
                    customData: {
                        paymentId: paymentId,
                    },
                })

                if (payment.code != null) {
                    this.setWaitingPayment(false)
                    console.log(payment)
                    this.openFailDialog(payment.message)
                    return
                }

                // 3. 결제 완료 처리 (Payment ID와 PortOne Payment ID 모두 전송)
                const completeResponse = await fetch("/api/v1/payments/complete", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        paymentId: paymentId,
                        portOnePaymentId: payment.paymentId,
                    }),
                })
                this.setWaitingPayment(false)
                if (completeResponse.ok) {
                    const paymentComplete = await completeResponse.json()
                    switch (await paymentComplete.status) {
                        case "PAID":
                            this.openSuccessDialog()
                            break
                        case "VIRTUAL_ACCOUNT_ISSUED":
                            this.openVirtualAccountDialog()
                            break
                    }
                } else {
                    this.openFailDialog(await completeResponse.text())
                }
            }
            for (const dialogButton of document.getElementsByClassName(
                "closeDialog",
            )) {
                dialogButton.onclick = () => {
                    dialogButton.closest('dialog').open = false
                }
            }
            window.checkoutDialog.style = ""
        }
        this.setWaitingPayment = (isWaiting) => {
            window.checkoutButton.setAttribute("aria-busy", isWaiting.toString())
            window.checkoutButton.disabled = isWaiting
        }
        this.openFailDialog = (message) => {
            window.failMessage.replaceChildren(message)
            window.failDialog.open = true
        }
        this.openSuccessDialog = () => {
            window.successDialog.open = true
        }
        this.openVirtualAccountDialog = () => {
            window.virtualAccountDialog.open = true
        }
        function randomId() {
            return [...crypto.getRandomValues(new Uint32Array(2))]
                .map((word) => word.toString(16).padStart(8, "0"))
                .join("")
        }
    }
</script>
</body>
</html>
