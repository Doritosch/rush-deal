server:
  port: 8000

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-routes
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: point-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/points/**

            - id: auth-routes
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: queue-service
              uri: lb://queue-service
              predicates:
                - Path=/api/v1/queues/**, /api/v1/queue/policies/**, /api/v1/internal/queues/**

          discovery:
            locator:
              enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}
    expiration: ${JWT_ACCESS_EXPIRED}

gateway:
  public-paths:
    - /api/v1/auth/signup
    - /api/v1/auth/login
    - /actuator/health
