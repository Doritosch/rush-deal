spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:15432/rushdeal_db
    username: rushdeal
    password: rushdeal
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: order_schema

  # 스키마 자동 생성
  sql:
    init:
      mode: always

server:
  port: 8050

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: localhost
    prefer-ip-address: true
