version: '3.8'

services:
  rushdeal_postgres:
    image: postgres:16-alpine
    container_name: rushdeal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rushdeal_db
      POSTGRES_USER: rushdeal
      POSTGRES_PASSWORD: rushdeal
    ports:
      - "15432:5432"
    volumes:
      - rushdeal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rushdeal -d rushdeal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rushdeal_queue_redis: # 서비스 이름은 rushdeal_redis로 설정합니다.
    image: redis:7-alpine
    container_name: rushdeal_queue_redis
    restart: unless-stopped
    ports:
      - "6380:6379" # 6379가 Redis 기본 포트이나, 호스트 포트를 6380으로 설정하여 기존 충돌을 피합니다.
    volumes:
      - rushdeal_queue_redis_data:/data # 데이터 영속성을 위한 볼륨
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rushdeal_order_redis:
    image: redis:7-alpine
    container_name: rushdeal_order_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - rushdeal_order_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5


  zookeeper:
    image: wurstmeister/zookeeper:latest
    platform: linux/amd64
    container_name: rushdeal_zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    platform: linux/amd64
    container_name: rushdeal_kafka
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    ports:
      - "29092:29092"
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    container_name: rushdeal_kafka_ui
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"


volumes:
  rushdeal_pg_data:
  rushdeal_queue_redis_data:
  rushdeal_order_redis_data:
